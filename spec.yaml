# Turtles Under Care — Daily Operations Workflow
#
# Data source: turtle_data_form_v2 only.
#
# "Under care" means the Disposition Location field is Rescue Center or Sea
# Aquarium — records with any other disposition (a beach name, released,
# deceased, etc.) are excluded.

id: turtles_under_care

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge
  - name: ecoscope-workflows-ext-curacao
    version: "0.0.7"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    # ── State Filter ──────────────────────────────────────────────────────────────
    state_filter.properties.values.title: State
    state_filter.properties.values.description: >
      Choose which event states to include. If left empty, events of all
      states will be included.
    state_filter.properties.values.items.enum:
      - active
      - resolved
    state_filter.properties.values.uniqueItems: true
    state_filter.properties.values.minItems: 1
    state_filter.properties.values.default:
      - active

    # ── Grouping ──────────────────────────────────────────────────────────────────
    groupers.properties.groupers.description: >
      Specify how the data should be grouped to create the views for your
      dashboard. This field is optional; if left blank, all the data will
      appear in a single view.
    groupers.properties.groupers.items.anyOf:
      - "$ref": "#/$defs/ValueGrouper"
    groupers.properties.groupers.default:
      - index_name: dispositon_location

    # ── Word Report ───────────────────────────────────────────────────────────────
    report_template_path.properties.var.title: Report Template Path
    report_template_path.properties.var.description: >
      Path or URL to the .docx Jinja2 template used for the turtles-under-care
      Word report.
    report_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/curacao-turtle_care/main/resources/templates/turtle_care_template.docx"
    report_template_path.properties.var.ecoscope:advanced: true

  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: dispositon_location
        title: Disposition Location
      - const: turtle_number
        title: Turtle Number

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  # ── Fetch & Process ───────────────────────────────────────────────────────────

  - name: Fetch Turtle Care Events
    id: all_events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - geometry
        - event_details
        - state
      event_types:
        - turtle_data_form_v2
      include_details: true
      include_display_values: true
      raise_on_empty: false
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      force_point_geometry: true

  - id: state_filter
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events.return }}
      column: state

  - name: Set Groupers
    id: groupers
    task: set_groupers

  - name: Report Template Path
    id: report_template_path
    task: set_string_var

  - name: Process Event Details
    id: all_events_processed
    task: process_events_details
    partial:
      df: ${{ workflow.state_filter.return }}
      client: ${{ workflow.er_client.return }}
      map_to_titles: false
      ordered: false

  - name: Extract Turtle Care Fields
    id: turtles_df
    task: extract_turtle_care_fields
    partial:
      df: ${{ workflow.all_events_processed.return }}
      time_range: ${{ workflow.time_range.return }}

  - name: Filter Under Care
    id: under_care_df
    task: filter_row_values
    partial:
      df: ${{ workflow.turtles_df.return }}
      column: dispositon_location
      values:
        - Rescue Center
        - Sea Aquarium

  - name: Split by Groupers
    id: grouped_turtles
    task: split_groups
    partial:
      df: ${{ workflow.under_care_df.return }}
      groupers: ${{ workflow.groupers.return }}

  # ── Headline Stats ────────────────────────────────────────────────────────────

  - title: Headline Stats
    type: task-group
    description: Turtle counts, per group.
    tasks:

      - name: Total Turtles Count
        id: total_turtles_count
        task: dataframe_count
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_turtles.return }}

      - name: Total Turtles Widget
        id: total_turtles_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Turtles Under Care"
          decimal_places: 0
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.total_turtles_count.return }}

      - name: Merge Total Turtles Widget Views
        id: total_turtles_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.total_turtles_widget.return }}

      - name: Filter FP Turtles
        id: fp_turtles
        task: filter_row_values
        partial:
          column: fibropapillomatosis
          values:
            - "yes"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_turtles.return }}

      - name: FP Count
        id: fp_count
        task: dataframe_count
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.fp_turtles.return }}

      - name: FP Widget
        id: fp_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Turtles with FP"
          decimal_places: 0
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.fp_count.return }}

      - name: Merge FP Widget Views
        id: fp_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.fp_widget.return }}

  # ── Summary Table ─────────────────────────────────────────────────────────────

  - title: Summary Table
    type: task-group
    description: ""
    tasks:

      - name: Map FP Display
        id: fp_display_df
        task: map_values
        partial:
          column_name: fibropapillomatosis
          value_map:
            "yes": "Y"
            "no": "N"
          missing_values: replace
          replacement: ""
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_turtles.return }}

      - name: Select Table Columns
        id: turtle_care_table_df
        task: map_columns
        partial:
          drop_columns: []
          raise_if_not_found: true
          retain_columns:
            - dispositon_location
            - turtle_number
            - pit_tag
            - specie
            - fibropapillomatosis
            - days_in_care
            - date
            - weight_kg
            - curved_carapace_length_cm
            - curved_carapace_width_cm
            - straight_carapace_length_cm
            - straight_carapace_width_cm
            - tail_length_cm
            - abnormalities
          rename_columns:
            dispositon_location: "Disposition Location"
            turtle_number: "Turtle number"
            pit_tag: "Pit Tag"
            specie: "Species"
            fibropapillomatosis: "FP (Y/N)"
            days_in_care: "Days in care"
            date: "Measurement Date"
            weight_kg: "Weight (kg)"
            curved_carapace_length_cm: "Curved Carapace Length (cm)"
            curved_carapace_width_cm: "Curved Carapace Width (cm)"
            straight_carapace_length_cm: "Straight Carapace Length (cm)"
            straight_carapace_width_cm: "Straight Carapace Width (cm)"
            tail_length_cm: "Tail Length (cm)"
            abnormalities: "Abnormalities"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.fp_display_df.return }}

      - name: Draw Turtle Care Table
        id: turtle_care_table_drawn
        task: draw_table_with_cell_colors
        partial:
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "turtle_care_table_widget"
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.turtle_care_table_df.return }}

      - name: Persist Turtle Care Table
        id: persist_turtle_care_table
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: turtle_care_table
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.turtle_care_table_drawn.return }}

      - name: Turtle Care Table Widget
        id: turtle_care_table_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Turtles Under Care"
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.persist_turtle_care_table.return }}

      - name: Merge Turtle Care Table Widget Views
        id: turtle_care_table_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.turtle_care_table_widget.return }}

  # ── Word Report ───────────────────────────────────────────────────────────────
  # Unlike the dashboard (split per-group via grouped_turtles), the report is
  # one combined document covering all groups, so its table/counts are built
  # once directly on the ungrouped under_care_df dataframe.

  - title: Word Report
    type: task-group
    description: ""
    tasks:

      - name: Total Turtles Count (Report)
        id: total_turtles_count_report
        task: dataframe_count
        partial:
          df: ${{ workflow.under_care_df.return }}

      - name: Filter FP Turtles (Report)
        id: fp_turtles_report
        task: filter_row_values
        partial:
          df: ${{ workflow.under_care_df.return }}
          column: fibropapillomatosis
          values:
            - "yes"

      - name: FP Count (Report)
        id: fp_count_report
        task: dataframe_count
        partial:
          df: ${{ workflow.fp_turtles_report.return }}

      - name: Map FP Display (Report)
        id: fp_display_df_report
        task: map_values
        partial:
          df: ${{ workflow.under_care_df.return }}
          column_name: fibropapillomatosis
          value_map:
            "yes": "Y"
            "no": "N"
          missing_values: replace
          replacement: ""

      - name: Select Table Columns (Report)
        id: turtle_care_table_report
        task: map_columns
        partial:
          df: ${{ workflow.fp_display_df_report.return }}
          drop_columns: []
          raise_if_not_found: true
          retain_columns:
            - dispositon_location
            - turtle_number
            - pit_tag
            - specie
            - fibropapillomatosis
            - days_in_care
            - date
            - weight_kg
            - curved_carapace_length_cm
            - curved_carapace_width_cm
            - straight_carapace_length_cm
            - straight_carapace_width_cm
            - tail_length_cm
            - abnormalities
          rename_columns:
            dispositon_location: "Disposition Location"
            turtle_number: "Turtle number"
            pit_tag: "Pit Tag"
            specie: "Species"
            fibropapillomatosis: "FP (Y/N)"
            days_in_care: "Days in care"
            date: "Measurement Date"
            weight_kg: "Weight (kg)"
            curved_carapace_length_cm: "Curved Carapace Length (cm)"
            curved_carapace_width_cm: "Curved Carapace Width (cm)"
            straight_carapace_length_cm: "Straight Carapace Length (cm)"
            straight_carapace_width_cm: "Straight Carapace Width (cm)"
            tail_length_cm: "Tail Length (cm)"
            abnormalities: "Abnormalities"

      - name: Normalize Output Dir
        id: norm_output_dir
        task: remove_file_scheme
        partial:
          path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      - name: Generate DOCX Report
        id: docx_report
        task: generate_turtle_care_report
        skipif:
          conditions:
            - never
        partial:
          time_range: ${{ workflow.time_range.return }}
          turtle_care_table: ${{ workflow.turtle_care_table_report.return }}
          total_turtles_count: ${{ workflow.total_turtles_count_report.return }}
          fp_count: ${{ workflow.fp_count_report.return }}
          template_path: ${{ workflow.report_template_path.return }}
          output_dir: ${{ workflow.norm_output_dir.return }}

  # ── Dashboard ─────────────────────────────────────────────────────────────────

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      groupers: ${{ workflow.groupers.return }}
      widgets:
        - ${{ workflow.total_turtles_widget_merged.return }}
        - ${{ workflow.fp_widget_merged.return }}
        - ${{ workflow.turtle_care_table_widget_merged.return }}
      time_range: ${{ workflow.time_range.return }}
